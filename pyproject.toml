# Workspace root (virtual: no package of its own). `uv sync` installs backend/*, admin-backend and database.
[project]
name = "prawdowid"
version = "0.1.0"
description = "Prawdowid: evidence-backed claim verification (workspace root)"
requires-python = ">=3.10"
dependencies = ["admin", "api", "crawler", "database", "discord-bot", "intake", "rag"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.workspace]
members = ["backend/*", "admin-backend", "database"]

[tool.uv.sources]
admin = { workspace = true }
api = { workspace = true }
crawler = { workspace = true }
database = { workspace = true }
discord-bot = { workspace = true }
intake = { workspace = true }
rag = { workspace = true }
# CPU-only torch wheels (avoids ~3 GB of CUDA libraries for a 118M-parameter model).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# backend/crawler/tests is a package (__init__.py), so its conftest does not clash with backend/rag/tests/conftest.py
testpaths = ["backend/rag/tests", "backend/crawler/tests", "backend/intake/tests", "backend/api/tests", "backend/discord_bot/tests", "admin-backend/tests"]

[tool.ty.environment]
extra-paths = ["backend/rag/tests", "scripts"]  # tests import conftest and scripts/eval_verify.py
