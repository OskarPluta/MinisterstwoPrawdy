[project]
name = "prawdowid"
version = "0.1.0"
description = "Prawdowid: evidence-backed claim verification (RAG prototype)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "numpy>=1.26",
    "openai>=3.57.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
e5 = ["sentence-transformers>=3.0", "torch>=2.2"]

# CPU-only torch wheels (avoids ~3 GB of CUDA libraries for a 118M-parameter model).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
prawdowid = "backend.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["tests", "scripts"]  # tests import conftest and scripts/eval_verify.py
