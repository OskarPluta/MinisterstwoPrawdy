[project]
name = "rag"
version = "0.1.0"
description = "Prawdowid: evidence-backed claim verification (RAG prototype)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "crawler",  # live lookup (rag/live.py) reuses crawler.fetcher: robots.txt, per-host spacing, backoff
    "database",  # schema and named SQL queries (top-level database/)
    "httpx>=0.27",  # Jev (rag/jev.py)
    "numpy>=1.26",
    "openai>=3.57.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "typer>=0.12",
]

[tool.uv.sources]
crawler = { workspace = true }
database = { workspace = true }

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
