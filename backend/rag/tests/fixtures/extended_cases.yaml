  - id: C-05
    scenario: Autentyczna sprzeczność / rozbieżność między dwoma wiarygodnymi źródłami (prognoza PKB 2027)
    tags:
    - rozbieżność
    input: MF mówi, że PKB w 2027 urośnie o 3%, a Komisja Europejska że o 2,7%. To kto w końcu ma rację?
    expect: insufficient
    expect_any:
    - insufficient
    - unverifiable
    - misleading
    reference: Obie liczby pochodzą z aktualnych, wiarygodnych, lecz odmiennych prognoz makroekonomicznych na przyszły
      rok i na obecnym etapie nie można rozstrzygnąć, która z nich się sprawdzi. Ministerstwo Finansów w Projekcie
      ustawy budżetowej na rok 2027 (przytoczonym w komunikacie z 17 listopada 2026 r.) zakłada wzrost realnego PKB
      o 3,0% w 2027 r. (oraz 3,6% w 2026 r.). Komisja Europejska w jesiennej prognozie gospodarczej (Autumn Forecast
      2026) przewiduje natomiast niższy wzrost na poziomie 2,7% w 2027 r. (i 3,5% w 2026 r.). Jak wyjaśnia Ministerstwo
      Finansów, różnica 0,3 pkt proc. na 2027 r. wynika z przyjętego przez KE założenia silniejszego wyhamowania spożycia
      ogółem i inwestycji (spadek absorpcji środków z UE po KPO), wyższej inflacji HICP (KE prognozuje 4,4% w 2027
      r.) oraz stosowanej przez KE metodologii no-policy change.

