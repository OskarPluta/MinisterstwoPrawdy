  - id: F-02
    scenario: Zrzut ekranu / Phishing SMS o mandacie drogowym (CERT Polska)
    tags:
    - zrzut
    input: Dostałem taki SMS. Czy to prawdziwe wezwanie do zapłaty mandatu i czy mam kliknąć ten link?
    requires:
