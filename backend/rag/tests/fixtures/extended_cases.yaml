    - moje.cert.pl
    - cert.pl
    reference: Nie, to próba oszustwa (phishing) — nie klikaj w link ani nie podawaj swoich danych. Zrzut ekranu przedstawia
      SMS podszywający się pod Wydział Ruchu Drogowego Policji, informujący o rzekomym nieopłaconym mandacie (148,50
      PLN) i kierujący na podejrzaną domenę gov-mandat-oplata.pl (niebędącą oficjalną domeną gov.pl). W komunikacie
      nr 212/2026 z 12 listopada 2026 r. CERT Polska ostrzega dokładnie przed taką kampanią SMS-ową o mandatach, w
      której oszuści wyłudzają dane prawa jazdy i karty płatniczej. Należy również pamiętać, że sam wygląd zrzutu
      ekranu czy nazwa nadawcy SMS nie dowodzą jego autentyczności. Podejrzany SMS można przekazać do CERT Polska
      na bezpłatny numer 8080.

