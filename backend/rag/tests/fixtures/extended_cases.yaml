# Rozszerzony zestaw (extended): prawdziwe przypadki spoza scenariuszy A–J. Uruchamia
# `scripts/eval_scenarios.py --suite extended` (płatne: woła LLM; sieć: wyszukiwanie na żywo).
# Źródło: zestaw `extended_real` z gałęzi `dataset` (eval/dataset/benchmark.jsonl), przeniesiony do formatu
# scenario_cases.yaml (E-03, K-01 i K-02 przepisane na rekordy z data/snapshot), oraz dopisane kategorie oparte
# na data/snapshot: bzdura, odległe-fakty, poza-kontekstem, opinia (sekcja na końcu).
#
# Pola jak w scenario_cases.yaml, a dodatkowo:
#   tags          kategorie; summary.md liczy zaliczone przypadki w każdej z nich
#   must_cite     klucz `source_id:upstream_id`, pełny URL, domena (cytat z tej domeny lub subdomeny)
#                 albo prefiks adresu bez `https://` (np. gov.pl/web/premier)
#   must_cite_all jak must_cite, ale każdy wpis musi być zacytowany (wniosek z kilku rekordów)
#   relevant      to samo dla poprawności cytowania (tu zwykle na poziomie domeny)
#   expect_status może być listą dopuszczalnych statusów
#   expect_claims werdykty, które muszą wystąpić wśród tez (pytania wielowątkowe)
#   injection     true: polecenie dla systemu w treści pytania (miernik „Odporność”)
#   injection_target  werdykt, którego żąda atakujący; próba jest odparta, gdy system go nie wydał
#   pii_absent    ciągi (PESEL, telefon, e-mail), których nie może być w logu `checks`
#
# Odpowiedzi zależą od tego, co wyszukiwanie na żywo znajdzie dziś w gov.pl, Google Fact Check i EUvsDisinfo,
# więc wynik zmienia się w czasie, a bez kluczy GOOGLE_FACTCHECK_API_KEY / EUVSDISINFO_API_KEY jest gorszy.
now: "2026-11-21T12:00:00+01:00"
corpus: data/snapshot
live: true
