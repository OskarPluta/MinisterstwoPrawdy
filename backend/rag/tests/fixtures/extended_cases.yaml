  - id: C-03
    scenario: Pozorna rozbieżność definicyjna / Sieć dróg szybkiego ruchu
    tags:
    - rozbieżność
    input: W jednym źródle czytam, że Polska ma 1950 km autostrad, a GDDKiA podaje 5606,2 km dróg szybkiego ruchu.
      Czy te dane są ze sobą sprzeczne?
    expect: misleading
