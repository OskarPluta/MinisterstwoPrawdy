      informacje o sieci dróg krajowych'). Kategoria 'dróg szybkiego ruchu' o łącznej długości 5606,2 km obejmuje
      łącznie autostrady (1950 km, w tym 465 km odcinków koncesyjnych) oraz drogi ekspresowe (3656,2 km). Całkowita
