[project]
name = "discord-bot"
version = "0.1.0"
description = "Prawdowid: Discord bot channel (wraps rag.verify.Verifier or HTTP API)"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "rag",
]

[project.scripts]
discord-bot = "discord_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_bot"]
