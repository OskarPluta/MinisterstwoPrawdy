[project]
name = "api"
version = "0.1.0"
description = "Prawdowid: HTTP API for the web frontend (wraps rag.verify.Verifier)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rag",
]

[project.scripts]
api = "api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
