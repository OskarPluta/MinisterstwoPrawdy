[project]
name = "intake"
version = "0.1.0"
description = "Prawdowid: turns links, YouTube videos, images and PDFs from the user into text for rag.verify"
requires-python = ">=3.11"
dependencies = [
    "crawler",  # robots.txt parser, anti-bot page detection, article extraction (no network code reused)
    "httpx>=0.27",
    "pillow>=10.0",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "rag",  # rag.attachments.Attachment (the contract) and the LLM for image transcription
]

[project.scripts]
intake = "intake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake"]
