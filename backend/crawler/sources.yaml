# FaktBot – konfiguracja źródeł. Nowe źródło = nowy wpis, bez zmian w kodzie.
#
# Typy: rss | html_list | sitemap | json_api | static_page
# Wspólne pola: name, type, institution, url/urls, interval_minutes, max_items_per_run, recheck_hours,
#   doc_type, region, silence_alert_hours, enabled
# rss: fetch_full (domyślnie true – pobiera pełny artykuł; false – zapisuje opis z kanału)
# html_list: path_prefix, link_selector (CSS), exclude_regex, require_date, skip_chrome, pagination{template,start,max_pages}
# sitemap: path_prefix, exclude_regex, max_sitemaps (domyślnie 20)
# attribution: dopisek o źródle danych (każdy typ; pole w dokumencie, przy json_api także w treści)
# ekstrakcja (rss/html_list/sitemap/static_page): content_selector (wszystkie dopasowania), title_selector,
#   strip_title_suffix (regex), drop_selectors
# json_api: endpoint, records_path, id_field | id_template, title_template, date_fields, attribution, sort_lists,
#   accept, page_template + page_start + max_pages (stronicowanie), record_filter{pole: [wartości]},
#   detail_url + detail_path + detail_as (szczegóły każdego rekordu), drop_fields (wzorce), require_fields
# Zasada: jeśli źródło ma API (udokumentowane albo endpoint JSON, z którego korzysta sama strona), używamy json_api.

settings:
  contact: testtest@gmail.com   # TYMCZASOWY – zmień na właściwy (albo export CRAWLER_CONTACT=...)
  data_dir: ../../data/crawl   # względem tego pliku, czyli <repo>/data/crawl (gitignored)
  min_delay_seconds: 3     # min. odstęp zapytań do jednego hosta (poniżej 3 s tylko dla localhost)
  render_timeout_seconds: 20

defaults:
  interval_minutes: 60
  max_items_per_run: 30
  recheck_hours: 24
  silence_alert_hours: 168

# Wspólny profil CMS gov.pl (wstawiany przez "<<: *govpl").
# <h1> na gov.pl to logo serwisu, a tytuł artykułu to <h2> w <article>. Treść jest w .editor-content.
# trafilatura gubi tam np. numery telefonów zapisane jako <h4>. .metrics/.metric-history to metryczka BIP.
x-govpl: &govpl
  title_selector: "article h2"
  content_selector: "article .editor-content"
  drop_selectors: [".metrics", ".metric-history", ".gallery", ".main-photo"]
  strip_title_suffix: " - [^-]+ - Portal Gov\\.pl"

sources:
  # ======================= Wykluczone źródła (nie crawlujemy; blokad nie obchodzimy → wniosek o dane) =======================
  # - cert-polska-komunikaty  https://moje.cert.pl/komunikaty/  – lista dopuszczona w robots.txt; czeka na decyzję
  # - utk  https://utk.gov.pl/dokumenty/rss/  – robots.txt "User-agent: * / Disallow: /" (tylko Googlebot)
  # - wody-polskie-nawigacyjne  https://www.gov.pl/web/wody-polskie/komunikaty-nawigacyjne  – brak list z datami; czeka na decyzję
  # - ulc  https://ulc.gov.pl/  – Imperva/Incapsula (wyzwanie JS zamiast treści)
  # - rso-ogolne  https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/<kategoria>/<strona>?_format=json  – czeka na decyzję
  # - odyseusz  https://odyseusz.gov.pl (API /api/v1/informacje/profile-panstw)  – aplikacja Angular; czeka na decyzję
  # - gddkia  https://drogi.gddkia.gov.pl  – Incapsula
  # - portal-pasazera  https://portalpasazera.pl  – blokuje automaty
  # - monitoring.paa.gov.pl, powietrze.gios.gov.pl, meteo/hydro/baltyk.imgw.pl  – dane pomiarowe (IMGW: zamiast nich API)
  # Włączone, ale dziś zablokowane (powód przy wpisach): cert-polska (robots.txt), sar (Incapsula).

  # ======================= RSS =======================
  - name: policja-kgp
    type: rss
    institution: Komenda Główna Policji
    # https://policja.pl/pol/rss to strona HTML ze spisem kanałów (nie kanał) – wskazuje dokładnie te dwa:
    urls:
      - https://policja.pl/dokumenty/rss/1-rss-1.rss      # Aktualności
      - https://policja.pl/dokumenty/rss/1-rss-o-4.rss    # Ważne informacje
    interval_minutes: 10
    silence_alert_hours: 48

  - name: policja-mazowiecka
    type: rss
    institution: Komenda Wojewódzka Policji zs. w Radomiu
    region: mazowieckie
    urls:
      - https://mazowiecka.policja.gov.pl/dokumenty/rss/271-rss-o-1487.rss
      - https://mazowiecka.policja.gov.pl/dokumenty/rss/271-rss-o-1488.rss
    interval_minutes: 10
    silence_alert_hours: 48

  - name: cert-polska
    type: rss
    institution: CERT Polska (NASK)
    doc_type: ostrzezenie
    url: https://moje.cert.pl/advisories/feed/
    interval_minutes: 15
    # robots.txt moje.cert.pl: "Disallow: /" + "Allow: /komunikaty/" → kanał /advisories/feed/ zablokowany.
    # Źródło dostaje status blocked i nic nie pobiera (zgodnie z założeniem).

  - name: kgsok
    type: rss
    institution: Komenda Główna Straży Ochrony Kolei
    url: https://kgsok.pl/feed/          # nie comments/feed
    # WordPress: lead + treść, bez metryczki (autor/data/Drukuj/Pobierz), przycisków i „Powiązanych wpisów”
    content_selector: ".single-new-lead, .single-new-content"
    drop_selectors: [".single-new-share-buttons", ".single-new-related-news", ".single-new-data"]

  # umgdy.gov.pl to Urząd MORSKI w Gdyni (nie Urząd Miasta). /rss → /feed/ jest pusty (WordPress, wpisy są
  # typu „aktualnosc”), dlatego używamy kanału archiwum aktualności.
  - name: um-gdynia
    type: rss
    institution: Urząd Morski w Gdyni
    region: pomorskie
    url: https://www.umgdy.gov.pl/aktualnosci/feed/
    # Sitemapa (robots.txt) wskazuje na umgdynia.dev.kdmc.pl (serwer deweloperski wykonawcy) – NIE używać.

  # ======================= listy aktualności (gov.pl) =======================
  - name: kgpsp-aktualnosci
    <<: *govpl
    type: html_list
    institution: Komenda Główna Państwowej Straży Pożarnej
    url: https://www.gov.pl/web/kgpsp/aktualnosci
    path_prefix: /web/kgpsp/
    pagination: {template: "page={n}&size=10", start: 2, max_pages: 3}

  - name: mon-aktualnosci
    <<: *govpl
    type: html_list
    institution: Ministerstwo Obrony Narodowej
    url: https://www.gov.pl/web/obrona-narodowa/aktualnosci5
    path_prefix: /web/obrona-narodowa/

  - name: mi-aktualnosci
    <<: *govpl
    type: html_list
    institution: Ministerstwo Infrastruktury
    url: https://www.gov.pl/web/infrastruktura/aktualnosci
    path_prefix: /web/infrastruktura/

  - name: gis-ostrzezenia
    <<: *govpl
    type: html_list
    institution: Główny Inspektorat Sanitarny
    doc_type: ostrzezenie
    url: https://www.gov.pl/web/gis/ostrzezenia
    path_prefix: /web/gis/
    interval_minutes: 20

  # Strony główne: sprawdzone 2026-11-21. Heurystyka łapie tylko kafelki aktualności (linki z menu/stopki odpadają).
  - name: rcb
    <<: *govpl
    type: html_list
    institution: Rządowe Centrum Bezpieczeństwa
    url: https://www.gov.pl/web/rcb/strona-glowna-rzadowego-centrum-bezpieczenstwa
    path_prefix: /web/rcb/
    interval_minutes: 15

  - name: mswia
    <<: *govpl
    type: html_list
    institution: Ministerstwo Spraw Wewnętrznych i Administracji
    url: https://www.gov.pl/web/mswia
    path_prefix: /web/mswia/

  - name: premier
    <<: *govpl
    type: html_list
    institution: Kancelaria Prezesa Rady Ministrów
    url: https://www.gov.pl/web/premier
    path_prefix: /web/premier/

  - name: paa
    <<: *govpl
    type: html_list
    institution: Państwowa Agencja Atomistyki
    url: https://www.gov.pl/web/paa/panstwowa-agencja-atomistyki
    path_prefix: /web/paa/

  # ======================= sitemap =======================
  # SAR: sitemapa się pobiera, ale strony artykułów dostają wyzwanie Incapsula → blocked. Nie obchodzimy → do wniosku.
  - name: sar
    type: sitemap
    institution: Morska Służba Poszukiwania i Ratownictwa (SAR)
    url: https://www.sar.gov.pl/sitemap.xml

  # ======================= API =======================
  - name: imgw-meteo
    type: json_api
    institution: Instytut Meteorologii i Gospodarki Wodnej – PIB
    doc_type: ostrzezenie_meteo
    endpoint: https://danepubliczne.imgw.pl/api/data/warningsmeteo
    interval_minutes: 5
    # Pola ustalone na podstawie odpowiedzi z 2026-11-21: id, nazwa_zdarzenia, stopien, prawdopodobienstwo,
    # obowiazuje_od, obowiazuje_do, opublikowano, tresc, komentarz, biuro, teryt[] (kody powiatów).
    id_field: id
    title_template: "Ostrzeżenie meteorologiczne: {nazwa_zdarzenia} – stopień {stopien}"
    date_fields: [opublikowano, obowiazuje_od]
    sort_lists: true          # kolejność kodów TERYT nie ma znaczenia – nie twórz przez nią nowych wersji
    attribution: "Źródłem pochodzenia danych jest Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy."
    silence_alert_hours: null

  - name: imgw-hydro
    type: json_api
    institution: Instytut Meteorologii i Gospodarki Wodnej – PIB
    doc_type: ostrzezenie_hydro
    endpoint: https://danepubliczne.imgw.pl/api/data/warningshydro
    interval_minutes: 5
    # Pola (2026-11-21): opublikowano, stopień, data_od, data_do (9999-12-31 = do odwołania), prawdopodobienstwo,
    # numer, biuro, zdarzenie, przebieg, komentarz, obszary[{wojewodztwo, opis, kod_zlewni[]}].
    # Brak pola id → identyfikator złożony: numer (numeracja w ramach biura) + rok publikacji + biuro.
    id_template: "{numer}-{opublikowano:.4}-{biuro}"
    title_template: "Ostrzeżenie hydrologiczne nr {numer}: {zdarzenie} – stopień {stopień} ({obszary[0].wojewodztwo})"
    date_fields: [opublikowano, data_od]
    sort_lists: true
    attribution: "Źródłem pochodzenia danych jest Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy."
    silence_alert_hours: null

  # RSO (Regionalny System Ostrzegania): endpoint JSON, z którego korzysta https://www.gov.pl/web/gov/ostrzezenia.
  # robots.txt gov.pl: "Allow: /". Ostatni segment ścieżki to numer strony (20 rekordów). Strony są numerowane od 1:
  # strona 0 to kopia strony 1, a numer spoza zakresu zwraca ostatnią stronę (adapter wtedy kończy).
  # Pola "0".."3" to tylko formaty dat ("Y-m-d H:i:s"). Kategoria informacje-drogowe to utrudnienia GDDKiA.
  # Kategoria stany-wod (~300 wodowskazów, często odświeżane) celowo pominięta, żeby nie zalać korpusu pomiarami.
  - &rso
    name: rso-ogolne
    type: json_api
    institution: Regionalny System Ostrzegania (KPRM / RCB)
    doc_type: ostrzezenie_rso
    endpoint: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/ogolne/1?_format=json
    page_template: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/ogolne/{page}?_format=json
    page_start: 1
    records_path: newses
    id_field: id
    title_template: "{title}"
    date_fields: [created_at, valid_from]
    drop_fields: ["0", "1", "2", "3", "shortcut", "provinces.*.id", "provinces.*.slug_name"]
    interval_minutes: 10
    silence_alert_hours: null

  - <<: *rso
    name: rso-meteorologiczne
    endpoint: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/meteorologiczne/1?_format=json
    page_template: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/meteorologiczne/{page}?_format=json

  - <<: *rso
    name: rso-hydrologiczne
    endpoint: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/hydrologiczne/1?_format=json
    page_template: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/hydrologiczne/{page}?_format=json

  - <<: *rso
    name: rso-drogowe
    endpoint: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/informacje-drogowe/1?_format=json
    page_template: https://www.gov.pl/api/data/proxy/rso/komunikatyxml/wszystkie/informacje-drogowe/{page}?_format=json

  # IMGW SYNOP: 62 stacje, jeden pomiar na godzinę (godzina_pomiaru w UTC). Dokument = stacja + data + godzina,
  # żeby dało się sprawdzać twierdzenia o przeszłości (ok. 1500 dokumentów na dobę przy pracy ciągłej).
  - name: imgw-synop
    type: json_api
    institution: Instytut Meteorologii i Gospodarki Wodnej – PIB
    doc_type: pomiar_synop
    endpoint: https://danepubliczne.imgw.pl/api/data/synop
    interval_minutes: 60
    id_template: "{id_stacji}-{data_pomiaru}-{godzina_pomiaru}"
    title_template: "Pomiar synoptyczny IMGW: {stacja}, {data_pomiaru} godz. {godzina_pomiaru}:00 UTC"
    date_fields: [data_pomiaru]
    attribution: "Źródłem pochodzenia danych jest Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy."
    silence_alert_hours: null

  # GIOŚ, indeks jakości powietrza (pjp-api v1): lista stacji, potem osobne zapytanie o indeks każdej stacji
  # z miast wojewódzkich (73 stacje, ok. 4 min przy 3 s na zapytanie). Na Accept: application/json API odpowiada 406.
  # Dokument = stacja + godzina obliczenia indeksu. Stacje bez policzonego indeksu są pomijane (require_fields).
  - name: gios-indeks-powietrza
    type: json_api
    institution: Główny Inspektorat Ochrony Środowiska
    doc_type: pomiar_powietrza
    endpoint: https://api.gios.gov.pl/pjp-api/v1/rest/station/findAll?page=0&size=500
    accept: "*/*"
    records_path: Lista stacji pomiarowych
    record_filter:
      Nazwa miasta: [Warszawa, Kraków, Łódź, Wrocław, Poznań, Gdańsk, Szczecin, Bydgoszcz, Toruń, Lublin,
                     Białystok, Katowice, Kielce, Olsztyn, Opole, Rzeszów, Zielona Góra, Gorzów Wielkopolski]
    detail_url: "https://api.gios.gov.pl/pjp-api/v1/rest/aqindex/getIndex/{Identyfikator stacji}"
    detail_path: AqIndex
    detail_as: indeks
    drop_fields: ["indeks.Identyfikator stacji pomiarowej", "indeks.Data wykonania obliczeń indeksu dla wskaźnika *",
                  "WGS84*", "Identyfikator miasta"]
    require_fields: ["indeks.Data wykonania obliczeń indeksu", "indeks.Nazwa kategorii indeksu"]
    id_template: "{Identyfikator stacji}-{indeks.Data wykonania obliczeń indeksu:.13}"
    title_template: "Indeks jakości powietrza GIOŚ: {Nazwa stacji} ({Nazwa miasta}) – {indeks.Nazwa kategorii indeksu}, {indeks.Data wykonania obliczeń indeksu:.16}"
    date_fields: ["indeks.Data wykonania obliczeń indeksu"]
    attribution: "Źródło danych: Główny Inspektorat Ochrony Środowiska, Państwowy Monitoring Środowiska."
    interval_minutes: 60
    silence_alert_hours: null

  # ======================= strony statyczne =======================
  # Treść to w praktyce lista tytułów komunikatów (same komunikaty są w podlinkowanych plikach), wykrywa ich zmianę.
  - name: ums-warunki-zeglugi
    type: static_page
    institution: Urząd Morski w Szczecinie
    url: https://www.ums.gov.pl/bezpieczenstwo-morskie/warunki-zeglugi
    interval_minutes: 60
    silence_alert_hours: null

  - name: rcb-raport-dobowy
    <<: *govpl
    type: static_page
    institution: Rządowe Centrum Bezpieczeństwa
    doc_type: raport
    url: https://www.gov.pl/web/rcb/raport-dobowy3
    interval_minutes: 60
    silence_alert_hours: 48

  # Uwaga: strona pokazuje tylko najnowszy komunikat dla podróżujących (jeden kraj). Pełne profile krajów
  # i ostrzeżenia są w Odyseuszu (patrz wykluczone źródła).
  - name: msz-informacje-dla-podrozujacych
    <<: *govpl
    type: static_page
    institution: Ministerstwo Spraw Zagranicznych
    url: https://www.gov.pl/web/dyplomacja/informacje-dla-podrozujacych
    interval_minutes: 360
    silence_alert_hours: null

  - name: prawa-pasazera
    <<: *govpl
    type: static_page
    institution: Ministerstwo Infrastruktury
    doc_type: informacja
    urls:
      - https://www.gov.pl/web/infrastruktura/prawa-pasazerow
      - https://www.gov.pl/web/infrastruktura/infolinia-dla-obywatela
      # https://ulc.gov.pl/prawa-pasazera, https://ulc.gov.pl/prawa-pasazera/poradnik-dla-pasazerow:
      #   Incapsula. https://utk.gov.pl/pl/pasazerowie: robots.txt UTK blokuje.
    interval_minutes: 10080     # raz w tygodniu
    silence_alert_hours: null
