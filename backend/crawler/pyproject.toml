[project]
name = "crawler"
version = "1.0"
description = "FaktBot: polite crawler of official announcements (JSONL with version history)"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "playwright>=1.45",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]
