# gov.pl: listy aktualności ministerstw i całe jednostki przez mapę strony.
# Wygenerowane 2026-11-22 z katalogu jednostek gov.pl (https://www.gov.pl/web/gov/katalog-jednostek) i stron głównych
# ministerstw. Nową jednostkę dodaje się czterema liniami pod odpowiednią kotwicą.
#
# 1) Listy aktualności (z datami): nowe artykuły szybko, co 30 min.
# 2) Całe jednostki: /web/<jednostka>/mapa-strony?show-bip=true w jednym zapytaniu daje wszystkie podstrony jednostki
#    (KGPSP: ~3100). Każdy przebieg pobiera do max_items_per_run nowych stron, reszta w kolejnych przebiegach.
#    background: true – scheduler uruchamia je tylko, gdy nie czeka żadne zwykłe źródło (alerty mają pierwszeństwo).
#    recheck_hours: 720 – znane strony sprawdzane ponownie raz na 30 dni.
#    Skala: ~95 jednostek, rzędu 100 tys. stron; przy 1 zapytaniu na 3 s to kilka dni pracy ciągłej (crawler run).
x-govpl: &govpl
  title_selector: "article h2"
  content_selector: "article .editor-content"
  drop_selectors: [".metrics", ".metric-history", ".gallery", ".main-photo"]
  strip_title_suffix: " - [^-]+ - Portal Gov\\.pl"

x-lista: &lista
  <<: *govpl
  type: html_list
  interval_minutes: 30
  pagination: {template: "page={n}&size=10", start: 2, max_pages: 3}

x-mapa: &mapa
  <<: *govpl
  type: html_list
  require_date: false        # mapa strony nie ma dat
  background: true
  interval_minutes: 60
  max_items_per_run: 40
  recheck_hours: 720
  doc_type: informacja
  silence_alert_hours: null

